name: Publish Android 1.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-1.0.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'marakirewa-dot/razbor-stati' && github.event.before == '9ee586f7a7ed24dd3e69e0849c246728edfd9588'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the tested APK and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: 9ee586f7a7ed24dd3e69e0849c246728edfd9588
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for file in RazborStati-1.0.apk SHA256SUMS.txt; do
            curl --fail --silent --show-error --location --retry 3 "https://raw.githubusercontent.com/$repo/$RELEASE_COMMIT/$file" --output "$file"
          done
          sha256sum --check SHA256SUMS.txt
          test "$(sha256sum RazborStati-1.0.apk | cut -d' ' -f1)" = 'd0067bb73a602af66a9af7a20c8f88afa6fd07ccd602ebcc5e985c45548ff4e3'
          cat > release.md <<'NOTES'
          Приложение для защиты статьи К. И. Кольчугина. Статья и пояснения встроены в APK. Открытие DOCX, поиск и подсветка проверены на эмуляторе Android 17 в авиарежиме.

          Посмотреть разбор можно до установки. [Скриншоты на странице проекта](https://github.com/marakirewa-dot/razbor-stati#readme)

          Для установки на телефон скачайте **RazborStati-1.0.apk** в разделе **Assets**.

          **SHA-256 APK** `d0067bb73a602af66a9af7a20c8f88afa6fd07ccd602ebcc5e985c45548ff4e3`
          NOTES
          gh release create v1.0 RazborStati-1.0.apk SHA256SUMS.txt --repo "$repo" --target "$RELEASE_COMMIT" --title "Разбор статьи 1.0 для Android" --notes-file release.md --latest
